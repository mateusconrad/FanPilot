# Every push to main (and every pull request, Dependabot's included): the encoding check, the build, the tests and
# the release zip, kept as the run's artifact. Work goes straight to main, so nothing waits on this check: a red
# build is fixed before the next item.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v7
      # The SDK in global.json: the runner image has newer ones, and the newest would be used otherwise.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Encoding dos scripts PowerShell
        run: ./scripts/check-encoding.ps1
      - name: Restaurar pacotes (packages.lock.json)
        run: dotnet restore FanPilot.sln --locked-mode
      - name: Compilar
        run: dotnet build FanPilot.sln -c Release --no-restore
      - name: Versão do exe
        run: |
          $version = (Select-Xml -Path Directory.Build.props -XPath '//VersionPrefix').Node.InnerText
          $expected = "FanPilot $version+" + (git rev-parse HEAD).Substring(0, 7)
          $actual = & ./bin/FanPilot.exe --version
          if ($actual -ne $expected) { throw "--version mostrou '$actual'; o esperado era '$expected'." }
          Write-Host $actual
      - name: Testes C#
        run: dotnet test FanPilot.sln -c Release --no-build
      - name: Testes do painel
        run: node --test "tests/js/*.test.mjs"

      - name: Empacotar
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          path: dist/FanPilot-*-win-x64.zip
          archive: false
