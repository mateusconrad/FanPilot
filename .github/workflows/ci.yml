# Every push to main (and every pull request, Dependabot's included): the encoding check, the build, the tests, the
# release zip, and the end-to-end tests with the zip's smoke test; and the Linux build with its tests (item 28). The
# zip, the Playwright report and the screenshots are kept as the run's artifacts. Work goes straight to main, so nothing waits on this check: a red build is fixed
# before the next item.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v7
      # The SDK in global.json: the runner image has newer ones, and the newest would be used otherwise.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Encoding dos scripts PowerShell
        run: ./scripts/check-encoding.ps1
      - name: Restaurar pacotes (packages.lock.json)
        run: dotnet restore FanPilot.sln --locked-mode
      - name: Compilar
        run: dotnet build FanPilot.sln -c Release --no-restore
      - name: Versão do exe
        run: |
          $version = (Select-Xml -Path Directory.Build.props -XPath '//VersionPrefix').Node.InnerText
          $expected = "FanPilot $version+" + (git rev-parse HEAD).Substring(0, 7)
          $actual = & ./bin/FanPilot.exe --version
          if ($actual -ne $expected) { throw "--version mostrou '$actual'; o esperado era '$expected'." }
          Write-Host $actual
      - name: Testes C#
        run: dotnet test FanPilot.sln -c Release --no-build
      - name: Testes do painel
        run: node --test "tests/js/*.test.mjs"

      - name: Empacotar
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          path: dist/FanPilot-*-win-x64.zip
          archive: false

      # The panel in Edge against FanPilot.exe on the fake board (a Debug build), then the zip's own exe.
      - name: Compilar (Debug, para a placa falsa)
        run: dotnet build src/FanPilot.csproj -c Debug --no-restore
      - name: Instalar o Playwright
        working-directory: tests/e2e
        run: npm ci
      - name: Testes de ponta a ponta e smoke do zip
        working-directory: tests/e2e
        run: |
          $env:FANPILOT_ZIP = (Resolve-Path ../../dist/FanPilot-*-win-x64.zip).Path
          npx playwright test
      - name: Guardar o relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
      - name: Guardar os screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: tests/e2e/screens

      # Item 30: autostart.ps1 as someone with the older version installed runs it: the scheduled task with a window
      # goes, the portable data\ comes along, the service comes up (automatic, answering), the Start menu shortcut opens
      # --tui with the port, the tray icon (item 14b) starts at logon with it too, and -Remove undoes it all but the
      # data. bin\FanPilot.exe is the Release build, on the runner's real board (no GCC, no PawnIO: monitoring only).
      - name: Partida sem janela (autostart.ps1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Register-ScheduledTask -TaskName FanPilot -Action (New-ScheduledTaskAction -Execute cmd.exe -Argument '/c exit') -Trigger (New-ScheduledTaskTrigger -AtLogOn) | Out-Null
          # A portable data\ as a FanPilot run by hand leaves it (another machine's id: its curves are set aside on import).
          New-Item -ItemType Directory -Force bin\data | Out-Null
          Set-Content bin\data\machine.json '{"machineId":"outro-pc","board":"Outra placa"}'
          Set-Content bin\data\config.json '{"port": 8790}'
          ./scripts/autostart.ps1
          if (Get-ScheduledTask -TaskName FanPilot -ErrorAction SilentlyContinue) { throw 'a tarefa agendada antiga continua lá' }
          $svc = Get-Service FanPilot
          if ($svc.Status -ne 'Running' -or $svc.StartType -ne 'Automatic') { throw "serviço: $($svc.Status), $($svc.StartType)" }
          if (-not (Test-Path "$env:ProgramData\FanPilot\config.json")) { throw 'a pasta data\ portátil não foi importada' }
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) { Start-Sleep -Milliseconds 500; try { $ok = (Invoke-WebRequest -UseBasicParsing http://localhost:8790/api/info -TimeoutSec 2).StatusCode -eq 200 } catch { } }
          if (-not $ok) { Get-Content "$env:ProgramData\FanPilot\fanpilot.log" -Tail 40; throw 'o serviço não respondeu na porta da pasta importada' }
          $lnk = Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'FanPilot.lnk'
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          if ($s.Arguments -notmatch '--tui --port 8790') { throw "atalho: $($s.TargetPath) $($s.Arguments)" }
          Write-Host "atalho: $($s.TargetPath) $($s.Arguments)"
          $tray = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run').FanPilotTray
          if ($tray -notmatch 'FanPilotTray\.exe" --port 8790$') { throw "bandeja no logon: '$tray'" }
          Write-Host "bandeja: $tray"
          ./scripts/autostart.ps1 -Remove
          if (Get-Service FanPilot -ErrorAction SilentlyContinue) { throw 'o serviço continua instalado' }
          if (Test-Path $lnk) { throw 'o atalho continua lá' }
          if ((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run').FanPilotTray) { throw 'a bandeja continua no logon' }
          if (Get-Process FanPilotTray -ErrorAction SilentlyContinue) { throw 'a bandeja continua aberta' }
          if (-not (Test-Path "$env:ProgramData\FanPilot\config.json")) { throw 'o -Remove apagou os dados' }

  # The Linux build (item 28): .NET 10, the tests on Linux as a plain user (the ones that need root are skipped, as
  # the ones that need Administrator are on a PC), the panel's, the terminal in a pseudo-terminal, the end-to-end tests
  # in Chromium, and the .tar.gz installed as a systemd service.
  linux:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Restaurar pacotes (packages.lock.json)
        run: dotnet restore FanPilot.sln --locked-mode
      - name: Compilar (net10.0)
        run: dotnet build tests/FanPilot.Tests/FanPilot.Tests.csproj -c Release -f net10.0 --no-restore
      - name: Versão
        run: |
          version=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
          expected="FanPilot $version+$(git rev-parse HEAD | cut -c1-7)"
          actual=$(dotnet bin/net10.0/FanPilot.dll --version)
          if [ "$actual" != "$expected" ]; then echo "--version mostrou '$actual'; o esperado era '$expected'."; exit 1; fi
          echo "$actual"
      - name: Testes C#
        run: dotnet test tests/FanPilot.Tests/FanPilot.Tests.csproj -c Release -f net10.0 --no-build
      - name: Testes do painel
        run: node --test "tests/js/*.test.mjs"
      # The terminal (item 29) in a real pseudo-terminal: FanPilot on the fake board draws it, and q closes FanPilot.
      - name: Interface no terminal
        run: |
          dotnet build src/FanPilot.csproj -c Debug -f net10.0 --no-restore
          cd src/bin/Debug/net10.0
          export TERM=xterm-256color
          (sleep 15; printf q) | script -qfec "stty cols 120 rows 30; dotnet FanPilot.dll --fake-board --no-browser" /tmp/tui.out > /dev/null
          for w in "Temperatures" "Fans" "RPM" "[q] close FanPilot" "Stopped in"; do
            grep -q -F "$w" /tmp/tui.out || { echo "A tela não mostrou: $w"; tail -c 3000 /tmp/tui.out; exit 1; }
          done

      # The panel in Playwright's Chromium against FanPilot on the fake board, as a plain user (item 28c).
      - name: Instalar o Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta
        working-directory: tests/e2e
        run: npx playwright test
      - name: Guardar o relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-linux
          path: tests/e2e/playwright-report

      - name: Empacotar
        run: sh scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          path: dist/FanPilot-*-linux-x64.tar.gz
          archive: false

      # The package as a user installs it, on a runner with systemd: the service comes up and answers, its data is
      # root's alone, it is brought back after a kill -9, --tui attaches to it, it stops clean and --remove undoes it.
      - name: Pacote e serviço do systemd
        run: |
          mkdir -p /tmp/pkg && tar -C /tmp/pkg -xzf dist/FanPilot-*-linux-x64.tar.gz
          cd /tmp/pkg/FanPilot-*
          sudo ./install.sh
          up() { for i in $(seq 1 60); do curl -sf -o /dev/null -H 'Host: localhost:8787' http://127.0.0.1:8787/api/info && return 0; sleep 0.5; done; return 1; }
          up || { sudo journalctl -u fanpilot --no-pager | tail -40; exit 1; }
          curl -sf -H 'Host: localhost:8787' http://127.0.0.1:8787/api/info; echo
          [ "$(sudo stat -c '%a %U' /var/lib/fanpilot)" = "700 root" ] || { echo "pasta de dados: $(sudo stat -c '%a %U' /var/lib/fanpilot)"; exit 1; }
          pid=$(systemctl show -p MainPID --value fanpilot)
          sudo kill -9 "$pid"
          sleep 3
          up || { echo "o systemd não reiniciou o FanPilot"; exit 1; }
          [ "$(systemctl show -p MainPID --value fanpilot)" != "$pid" ]
          # Item 30: "fanpilot" on the PATH and the menu entry open the terminal screen, without root.
          [ "$(readlink /usr/local/bin/fanpilot)" = "/opt/fanpilot/FanPilot" ]
          grep -q -F "Exec=/opt/fanpilot/FanPilot --tui --port 8787" /usr/share/applications/fanpilot.desktop
          export TERM=xterm-256color
          (sleep 8; printf q) | script -qfec "stty cols 120 rows 30; fanpilot --tui --port 8787" /tmp/tui2.out > /dev/null
          grep -q -F "[q] quit" /tmp/tui2.out || { echo "o --tui não se ligou ao serviço"; tail -c 2000 /tmp/tui2.out; exit 1; }
          systemctl is-active fanpilot
          start=$(date +%s%N); sudo systemctl stop fanpilot; took=$(( ($(date +%s%N) - start) / 1000000 ))
          echo "parada em $took ms"; [ "$took" -lt 3000 ]
          sudo grep -F "Stopped in" /var/lib/fanpilot/fanpilot.log | tail -1
          sudo ./install.sh --remove
          [ ! -e /etc/systemd/system/fanpilot.service ] && [ ! -d /opt/fanpilot ] && [ -d /var/lib/fanpilot ]
          [ ! -e /usr/local/bin/fanpilot ] && [ ! -e /usr/share/applications/fanpilot.desktop ]
