name: winget-debug
on:
  push:
    branches: [winget-debug]
jobs:
  manifest:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: winget install --manifest (como a validação)
        run: |
          winget --version
          winget settings --enable LocalManifestFiles
          New-Item -Force 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System' | Out-Null
          Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System' EnableSmartScreen 0 -Type DWord
          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer' SmartScreenEnabled 'Off'
          $base = 'https://raw.githubusercontent.com/mateusconrad/winget-pkgs/MateusConrad.FanPilot-0.1.0/manifests/m/MateusConrad/FanPilot/0.1.0'
          New-Item -ItemType Directory m | Out-Null
          foreach ($f in 'MateusConrad.FanPilot.yaml', 'MateusConrad.FanPilot.installer.yaml', 'MateusConrad.FanPilot.locale.en-US.yaml', 'MateusConrad.FanPilot.locale.pt-BR.yaml') {
            Invoke-WebRequest "$base/$f" -OutFile "m\$f" -UseBasicParsing
          }
          $p = Start-Process winget -ArgumentList 'install', '--manifest', "$PWD\m", '--silent', '--accept-package-agreements', '--accept-source-agreements', '--disable-interactivity', '--verbose-logs' -NoNewWindow -PassThru
          if (-not $p.WaitForExit(600000)) {
            "=== TRAVOU depois de 10 min; processos novos:"
            Get-CimInstance Win32_Process | Where-Object { $_.CreationDate -gt (Get-Date).AddMinutes(-11) } |
              Select-Object ProcessId, ParentProcessId, Name, CommandLine | Format-List | Out-String -Width 400
          } else { "=== winget saiu com código $($p.ExitCode)" }
          "=== install.log"; Get-Content "$env:ProgramFiles\FanPilot\install.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
          "=== logs do winget"; Get-ChildItem "$env:LOCALAPPDATA\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime | Select-Object -Last 3 | ForEach-Object { "--- $($_.Name)"; Get-Content $_.FullName -Tail 25 }
