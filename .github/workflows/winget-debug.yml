name: winget-debug
on:
  push:
    branches: [winget-debug]
jobs:
  manifest:
    strategy:
      fail-fast: false
      matrix:
        zone: [keep, drop]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: winget install --manifest (zona ${{ matrix.zone }})
        run: |
          winget settings --enable LocalManifestFiles
          if ('${{ matrix.zone }}' -eq 'drop') {
            foreach ($h in 'HKCU:', 'HKLM:') {
              $k = "$h\Software\Microsoft\Windows\CurrentVersion\Policies\Attachments"
              New-Item -Force $k | Out-Null
              Set-ItemProperty $k SaveZoneInformation 1 -Type DWord
              Set-ItemProperty $k ScanWithAntiVirus 1 -Type DWord
            }
          }
          $base = 'https://raw.githubusercontent.com/mateusconrad/winget-pkgs/MateusConrad.FanPilot-0.1.0/manifests/m/MateusConrad/FanPilot/0.1.0'
          New-Item -ItemType Directory m | Out-Null
          foreach ($f in 'MateusConrad.FanPilot.yaml', 'MateusConrad.FanPilot.installer.yaml', 'MateusConrad.FanPilot.locale.en-US.yaml', 'MateusConrad.FanPilot.locale.pt-BR.yaml') {
            Invoke-WebRequest "$base/$f" -OutFile "m\$f" -UseBasicParsing
          }
          $p = Start-Process winget -ArgumentList 'install', '--manifest', "$PWD\m", '--silent', '--accept-package-agreements', '--accept-source-agreements', '--disable-interactivity' -NoNewWindow -PassThru
          if (-not $p.WaitForExit(300000)) {
            "=== TRAVOU depois de 5 min"
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\screen.png")
            "=== janelas com título:"
            Get-Process | Where-Object MainWindowTitle | Select-Object Id, Name, MainWindowTitle | Format-Table -AutoSize | Out-String -Width 300
            "=== textos das janelas do winget (UIAutomation):"
            Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
            $root = [System.Windows.Automation.AutomationElement]::RootElement
            $cond = New-Object System.Windows.Automation.PropertyCondition ([System.Windows.Automation.AutomationElement]::ProcessIdProperty), $p.Id
            foreach ($w in $root.FindAll([System.Windows.Automation.TreeScope]::Children, $cond)) {
              "--- janela: $($w.Current.Name)"
              foreach ($e in $w.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) {
                if ($e.Current.Name) { "  [$($e.Current.ControlType.ProgrammaticName)] $($e.Current.Name)" }
              }
            }
            "=== árvore abaixo do winget:"
            $all = Get-CimInstance Win32_Process
            function Tree($id, $d) { foreach ($c in $all | Where-Object ParentProcessId -eq $id) { (' ' * $d) + "$($c.ProcessId) $($c.Name) :: $($c.CommandLine)"; Tree $c.ProcessId ($d + 2) } }
            Tree $p.Id 0
            "=== filhos do winget:"
            Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" | Select-Object ProcessId, Name, CommandLine | Format-List | Out-String -Width 400
          } else { "=== winget saiu com código $($p.ExitCode)" }
          $tmp = "$env:LOCALAPPDATA\Temp\WinGet\MateusConrad.FanPilot.0.1.0"
          "=== streams do instalador baixado:"; Get-Item "$tmp\*.exe" -Stream * -ErrorAction SilentlyContinue | Select-Object Stream, Length | Format-Table | Out-String
          Get-Content "$tmp\FanPilot-0.1.0-win-x64-setup.exe" -Stream Zone.Identifier -ErrorAction SilentlyContinue
          "=== Program Files\FanPilot existe? $(Test-Path "$env:ProgramFiles\FanPilot")"
          "=== log do Inno:"; Get-ChildItem "$env:LOCALAPPDATA\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir\WinGet-MateusConrad*" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 15 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-${{ matrix.zone }}
          path: screen.png
          if-no-files-found: ignore
