name: winget-debug
on:
  push:
    branches: [winget-debug]
jobs:
  silent:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Instalar como o winget (sem desligar o PawnIO)
        run: |
          winget --version
          Invoke-WebRequest https://github.com/mateusconrad/FanPilot/releases/download/v0.1.0/FanPilot-0.1.0-win-x64-setup.exe -OutFile setup.exe -UseBasicParsing
          $p = Start-Process .\setup.exe -ArgumentList '/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$PWD\setup.log" -PassThru
          if (-not $p.WaitForExit(600000)) {
            "=== TRAVOU depois de 10 min; processos:"
            Get-CimInstance Win32_Process | Where-Object { $_.CreationDate -gt (Get-Date).AddMinutes(-11) } |
              Select-Object ProcessId, ParentProcessId, Name, CommandLine | Format-List | Out-String -Width 400
          } else { "=== saiu com código $($p.ExitCode)" }
          "=== setup.log (fim)"; Get-Content setup.log -Tail 40
          "=== install.log"; Get-Content "$env:ProgramFiles\FanPilot\install.log" -ErrorAction SilentlyContinue
