name: Problem (problema)
description: Something in FanPilot doesn't work as it should. / Algo no FanPilot não funciona como deveria.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If it's the first time on a board other than the B760M GAMING X AX, use the **compatibility report**: it already asks for what helps to understand the board.
        Before attaching the log, check that it has nothing you'd rather not publish.

        Pode responder em português.
  - type: textarea
    id: problema
    attributes:
      label: What happened (o que aconteceu)
      description: And what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: How to reproduce (como reproduzir)
      placeholder: |
        1. Opened the panel on the phone
        2. Tapped System 1 › Fixed › 40% › Apply
        3. …
  - type: input
    id: versao
    attributes:
      label: FanPilot version (versão do FanPilot)
      description: The panel's footer, the first line of the log or `FanPilot.exe --version`.
      placeholder: 0.1.0+1a2b3c4
    validations:
      required: true
  - type: input
    id: placa
    attributes:
      label: Motherboard (placa-mãe)
      placeholder: Gigabyte Technology Co., Ltd. B760M GAMING X AX
    validations:
      required: true
  - type: dropdown
    id: caminho
    attributes:
      label: Path FanPilot used (caminho usado pelo FanPilot)
      description: In the panel's footer and in the log ("Motherboard via …").
      options:
        - Gigabyte Control Center
        - LibreHardwareMonitor
        - I don't know (não sei)
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Drag here `data\fanpilot.log`, or paste the lines around the problem.
      render: text
