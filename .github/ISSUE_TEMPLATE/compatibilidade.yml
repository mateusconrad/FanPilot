name: Compatibility report (Relato de compatibilidade)
description: Tested FanPilot on a motherboard? Tell how it went, even if it didn't work. / Testou numa placa-mãe? Conte como foi.
title: "[Compatibility] "
labels: ["compatibilidade"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Follow the [testing guide](https://github.com/mateusconrad/FanPilot/blob/main/docs/TESTING-OTHER-BOARDS.md), from the safest step to the least safe, and stop at the first one that does something odd. `FanPilot.exe --diagnose` writes a file with the link to this form already filled in and without serial numbers.
        The boards reported so far are in [docs/COMPATIBILITY.md](https://github.com/mateusconrad/FanPilot/blob/main/docs/COMPATIBILITY.md).

        Obrigado por testar! Siga o [guia de teste](https://github.com/mateusconrad/FanPilot/blob/main/docs/TESTANDO-OUTRAS-PLACAS.md) e pare na primeira etapa que der algo estranho. Pode responder em português.
  - type: input
    id: placa
    attributes:
      label: Motherboard model (modelo da placa-mãe)
      description: As shown in the diagnostics ("Motherboard (registry)") or on the box.
      placeholder: ASUSTeK COMPUTER INC. ROG STRIX B550-F GAMING (WI-FI)
    validations:
      required: true
  - type: input
    id: bios
    attributes:
      label: BIOS version (versão da BIOS)
      placeholder: "3607"
  - type: dropdown
    id: fabricante
    attributes:
      label: Maker (fabricante)
      options:
        - ASUS
        - ASRock
        - Biostar
        - Gigabyte
        - MSI
        - Other (outro)
    validations:
      required: true
  - type: dropdown
    id: caminho
    attributes:
      label: Path FanPilot used (caminho usado pelo FanPilot)
      description: In the panel's footer and in the log ("Motherboard via …").
      options:
        - Gigabyte Control Center
        - LibreHardwareMonitor
        - I don't know (não sei)
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: FanPilot version (versão do FanPilot)
      description: The panel's footer, or the first line of the log or of the diagnostics.
      placeholder: 0.1.0+1a2b3c4
    validations:
      required: true
  - type: checkboxes
    id: etapas
    attributes:
      label: What worked (o que funcionou)
      description: The steps of the testing guide.
      options:
        - label: "Diagnostics: listed the fans and plausible temperature sensors (diagnóstico)"
        - label: "Monitoring: temperatures and RPM match another program, such as HWiNFO or the maker's app (monitoramento)"
        - label: "Fixed fan: the RPM changed at 40% (fan fixo)"
        - label: "Curve: the RPM followed the temperature (curva)"
        - label: "On closing FanPilot, the fans went back to BIOS control, or, on a Gigabyte with GCC, the curve stayed in the chip (ao fechar)"
  - type: dropdown
    id: resultado
    attributes:
      label: Result (resultado)
      options:
        - It worked (funcionou)
        - It partly worked (funcionou em parte)
        - It didn't work (não funcionou)
    validations:
      required: true
  - type: textarea
    id: detalhes
    attributes:
      label: Details (detalhes)
      description: What happened at each step, what didn't work, messages in the panel, which fans are case fans, the CPU's or a pump.
  - type: textarea
    id: arquivos
    attributes:
      label: Diagnostics and log (diagnóstico e log)
      description: Drag here `data\diagnostico-….txt` and `data\fanpilot.log` from FanPilot's folder.
    validations:
      required: true
