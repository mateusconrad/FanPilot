<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9f7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d">
  <meta name="color-scheme" content="light dark">
  <title data-i18n-title="pair.pageTitle">FanPilot</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
</head>
<!-- Every word on the page comes from wwwroot/i18n: see js/i18n.mjs. -->
<body>
  <main class="pair">
    <div class="card-head"><h1 data-i18n="pair.title"></h1><a class="btn" href="/" data-i18n="pair.openPanel"></a></div>
    <section class="card" style="display:grid;gap:12px">
      <p style="margin:0" data-i18n="pair.scan"></p>
      <div class="qr" id="qr" role="img" data-i18n-attr="aria-label:pair.qr.aria"></div>
      <div class="url" id="url"></div>
      <div class="row" style="justify-content:space-between">
        <label class="field"><span data-i18n="pair.host"></span>
          <select id="host"></select>
        </label>
        <span class="hint" id="countdown"></span>
      </div>
    </section>
    <section class="card" style="display:grid;gap:10px">
      <div class="card-head" style="margin:0"><h2 data-i18n="pair.devices"></h2><button class="btn" id="revokeAll" data-i18n="pair.revokeAll"></button></div>
      <p class="notice-banner" id="pairError" role="alert" hidden></p>
      <div class="sessions" id="sessions"></div>
    </section>
    <p class="hint" data-i18n="pair.firewall"></p>
    <footer class="app-footer hint">
      <label class="lang-switch"><span data-i18n="footer.language"></span> <select id="langSelect"></select></label>
    </footer>
  </main>
  <script src="/vendor/qrcode.min.js"></script>
  <script type="module" src="/pair.js"></script>
</body>
</html>
