<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9f7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-title" content="FanPilot">
  <title>FanPilot</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
</head>
<!-- Every word on the page comes from wwwroot/i18n (data-i18n, data-i18n-attr): see js/i18n.mjs. -->
<body>
  <header class="top">
    <h1><img class="logo" src="/favicon.svg" alt="">FanPilot</h1>
    <div class="row">
      <span class="status"><span id="statusDot" class="dot"></span><span id="statusText" data-i18n="status.connecting"></span></span>
      <button id="logout" class="btn ghost" data-i18n="top.logout" data-i18n-attr="title:top.logout.title"></button>
    </div>
  </header>

  <main>
    <p class="notice-banner" id="notices" role="status" hidden></p>
    <div class="alert-banner" id="alertBanner" role="alert" hidden></div>
    <section class="tiles" id="tiles" aria-live="polite"></section>

    <section class="card">
      <div class="card-head">
        <h2 data-i18n="chart.temp.title"></h2>
        <div class="legend">
          <span><i style="background:var(--series-cpu)"></i>CPU</span>
          <span><i style="background:var(--series-gpu)"></i>GPU</span>
        </div>
      </div>
      <div class="chart-wrap" id="chartWrap">
        <svg id="chart" viewBox="0 0 640 220" role="img" data-i18n-attr="aria-label:chart.temp.aria"></svg>
        <div class="tip" id="tip"></div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 data-i18n="chart.rpm.title"></h2>
        <div class="legend" id="rpmLegend"></div>
      </div>
      <div class="chart-wrap" id="rpmWrap">
        <svg id="rpmChart" viewBox="0 0 640 220" role="img" data-i18n-attr="aria-label:chart.rpm.aria"></svg>
        <div class="tip" id="rpmTip"></div>
      </div>
      <p class="hint" id="rpmNote"></p>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <h2 data-i18n="fans.title"></h2>
          <span class="sub" id="fanSub" data-i18n="fans.sub"></span>
        </div>
        <button class="btn turbo" id="turboBtn" aria-pressed="false" data-i18n="turbo.off"></button>
      </div>
      <div class="seg profiles" role="group" data-i18n-attr="aria-label:profiles.aria" id="profileSeg" hidden>
        <button data-mode="profile:quiet" aria-pressed="false" data-i18n="preset.quiet"></button>
        <button data-mode="profile:standard" aria-pressed="false" data-i18n="preset.standard"></button>
        <button data-mode="profile:performance" aria-pressed="false" data-i18n="preset.performance"></button>
        <button data-mode="custom" aria-pressed="true" data-i18n="profiles.custom"></button>
      </div>
      <p class="turbo-banner" id="turboBanner" data-i18n="turbo.banner" hidden></p>
      <p class="hint fan-mode" id="fanMode" data-i18n="fans.softwareCurves" hidden></p>
      <div id="orphans"></div>
      <div class="fan-list" id="fans"></div>
    </section>

    <section class="card" id="gpuCard">
      <div class="card-head">
        <h2 id="gpuName">GPU</h2>
        <span class="sub" id="gpuSub"></span>
      </div>
      <div class="gpu-grid" id="gpuGrid"></div>
      <div class="row" id="gpuControls" style="justify-content:space-between">
        <div class="seg" role="group" data-i18n-attr="aria-label:gpu.mode.aria">
          <button id="gpuAuto" aria-pressed="true" data-i18n="gpu.auto"></button>
          <button id="gpuFixed" aria-pressed="false" data-i18n="gpu.fixed"></button>
        </div>
        <span class="big-value" id="gpuFanValue"></span>
      </div>
      <div id="gpuFixedBox" hidden style="margin-top:10px">
        <input type="range" id="gpuSlider" min="30" max="100" step="1" value="50" data-i18n-attr="aria-label:gpu.slider.aria">
        <div class="row" style="justify-content:space-between;margin-top:6px">
          <span class="hint" id="gpuSafety"></span>
          <button class="btn primary" id="gpuApply" data-i18n="common.apply"></button>
        </div>
      </div>
      <p class="hint" id="gpuNote" hidden></p>
    </section>

    <section class="card" id="alertsCard">
      <div class="card-head">
        <h2 data-i18n="alerts.title"></h2>
        <span class="sub" id="alertsSub"></span>
      </div>
      <div class="alert-list" id="alertList"></div>
      <details id="alertSettings">
        <summary data-i18n="alerts.settings"></summary>
        <div class="row">
          <label class="field">CPU (°C)
            <input type="number" id="alCpu" min="60" max="105" step="1">
          </label>
          <label class="field">GPU (°C)
            <input type="number" id="alGpu" min="60" max="100" step="1">
          </label>
          <label class="field"><span data-i18n="alerts.pcName"></span>
            <input type="text" id="alPcName" maxlength="40" autocomplete="off">
          </label>
        </div>
        <label class="field"><span data-i18n="alerts.ntfy"></span>
          <input type="text" id="alNtfy" autocomplete="off" placeholder="https://ntfy.sh/…">
        </label>
        <div class="row"><button class="btn" id="alNtfyNew" data-i18n="alerts.ntfy.new"></button><span class="hint" id="alNtfyState"></span></div>
        <div class="row">
          <label class="field"><span data-i18n="alerts.telegram.token"></span>
            <input type="text" id="alTgToken" autocomplete="off">
          </label>
          <label class="field"><span data-i18n="alerts.telegram.chat"></span>
            <input type="text" id="alTgChat" autocomplete="off">
          </label>
        </div>
        <p class="hint" id="alTgState"></p>
        <p class="hint" data-i18n="alerts.privacy"></p>
        <div class="row">
          <button class="btn primary" id="alSave" data-i18n="common.save"></button>
          <button class="btn" id="alTest" data-i18n="alerts.test"></button>
          <button class="btn" id="alClear" data-i18n="alerts.clear"></button>
        </div>
      </details>
    </section>

    <section class="card">
      <details>
        <summary data-i18n="sensors.all"></summary>
        <table class="sensors" id="sensorTable"></table>
      </details>
    </section>
    <footer class="app-footer hint">
      <span id="appVersion"></span>
      <a class="btn ghost" href="/panel" data-i18n="panel.link"></a>
      <label class="lang-switch"><span data-i18n="footer.language"></span> <select id="langSelect"></select></label>
    </footer>
  </main>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet editor" id="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="edTitle">
    <div class="row" style="justify-content:space-between">
      <h2 id="edTitle"></h2>
      <button class="btn ghost" id="edClose" data-i18n="common.close"></button>
    </div>
    <div class="discard" id="edDiscard" role="group" aria-labelledby="edDiscardText" hidden>
      <p id="edDiscardText"><strong data-i18n="ed.discard.question"></strong> <span data-i18n="ed.discard.text"></span></p>
      <div class="row">
        <button class="btn" id="edKeep" data-i18n="ed.discard.keep"></button>
        <button class="btn" id="edDiscardYes" data-i18n="ed.discard.yes"></button>
      </div>
    </div>
    <div class="row" style="justify-content:space-between">
      <div class="seg" role="group" data-i18n-attr="aria-label:ed.mode.aria">
        <button id="edModeCurve" aria-pressed="true" data-i18n="ed.mode.curve"></button>
        <button id="edModeFixed" aria-pressed="false" data-i18n="ed.mode.fixed"></button>
      </div>
      <label class="field"><span data-i18n="ed.source"></span>
        <select id="edTempInput"></select>
      </label>
    </div>
    <p class="hint" id="edSourceHint" data-i18n="ed.source.hint" hidden></p>

    <div id="edCurveBox">
      <div class="chips" id="edPresets" style="margin-bottom:8px"></div>
      <svg id="edSvg" viewBox="0 0 340 248" role="group" data-i18n-attr="aria-label:ed.points.aria"></svg>
      <p class="hint" id="edTuneHint" data-i18n="ed.tune.hint"></p>
      <div class="tune" id="edTune" hidden>
        <button class="btn" id="edTunePrev" data-i18n-attr="aria-label:ed.tune.prev">&#x25C0;&#xFE0E;</button>
        <span class="tune-label" id="edTuneLabel"></span>
        <button class="btn" id="edTuneNext" data-i18n-attr="aria-label:ed.tune.next">&#x25B6;&#xFE0E;</button>
        <div class="tune-steps">
          <div class="tune-group" role="group" data-i18n-attr="aria-label:ed.tune.temp">
            <button class="btn" id="edTuneTMinus" data-i18n-attr="aria-label:ed.tune.tempDown">−</button>
            <span aria-hidden="true">°C</span>
            <button class="btn" id="edTuneTPlus" data-i18n-attr="aria-label:ed.tune.tempUp">+</button>
          </div>
          <div class="tune-group" role="group" data-i18n-attr="aria-label:ed.tune.speed">
            <button class="btn" id="edTunePMinus" data-i18n-attr="aria-label:ed.tune.speedDown">−</button>
            <span aria-hidden="true">%</span>
            <button class="btn" id="edTunePPlus" data-i18n-attr="aria-label:ed.tune.speedUp">+</button>
          </div>
        </div>
        <p class="sr-only" id="edTuneLive" aria-live="polite"></p>
      </div>
      <div class="row" style="justify-content:space-between;margin-top:6px">
        <label class="field"><span data-i18n="ed.style"></span>
          <select id="edStyle">
            <option value="SmartFanMode" data-i18n="ed.style.linear"></option>
            <option value="StairStepMode" data-i18n="ed.style.steps"></option>
          </select>
        </label>
        <span class="hint" id="edNow"></span>
      </div>
      <div id="edResponseBox" hidden style="margin-top:8px">
        <label class="field"><span data-i18n="ed.response"></span>
          <select id="edResponse">
            <option value="fast" data-i18n="response.fast"></option>
            <option value="balanced" data-i18n="response.balanced"></option>
            <option value="smooth" data-i18n="response.smooth"></option>
          </select>
        </label>
        <p class="hint" id="edResponseHint"></p>
      </div>
      <p class="points-list" id="edPoints"></p>
    </div>

    <div id="edFixedBox" hidden>
      <div class="row" style="justify-content:space-between">
        <span data-i18n="ed.fixed.speed"></span><span class="big-value" id="edFixedValue">50%</span>
      </div>
      <input type="range" id="edFixedSlider" min="20" max="100" step="1" value="50" data-i18n-attr="aria-label:ed.fixed.aria">
      <p class="hint" id="edFixedHint"></p>
    </div>

    <p class="hint" id="edLimits"></p>
    <p class="notice-banner" id="edProfileNote" hidden></p>
    <p class="notice-banner" id="edPumpNote" data-i18n="ed.pumpNote" hidden></p>
    <details class="meta" id="edMeta">
      <summary data-i18n="ed.meta"></summary>
      <div class="row">
        <label class="field"><span data-i18n="ed.meta.name"></span>
          <input type="text" id="edLabel" maxlength="32" autocomplete="off">
        </label>
        <label class="field"><span data-i18n="ed.meta.role"></span>
          <select id="edRole">
            <option value="fan" data-i18n="ed.meta.role.fan"></option>
            <option value="pump" data-i18n="ed.meta.role.pump"></option>
          </select>
        </label>
      </div>
      <div class="row" id="edPumpBox">
        <label class="field"><span data-i18n="ed.meta.pump"></span>
          <select id="edPumpPolicy">
            <option value="full" data-i18n="ed.meta.pump.full"></option>
            <option value="min" data-i18n="ed.meta.pump.min"></option>
          </select>
        </label>
        <label class="field" id="edPumpMinField"><span data-i18n="ed.meta.pumpMin"></span>
          <input type="number" id="edPumpMin" min="50" max="100" step="5">
        </label>
      </div>
      <p class="hint" data-i18n="ed.meta.hint"></p>
      <div class="row"><button class="btn" id="edMetaSave" data-i18n="ed.meta.save"></button></div>
    </details>
    <div class="row" style="justify-content:space-between">
      <button class="btn" id="edRestore"></button>
      <button class="btn primary" id="edApply" data-i18n="common.apply"></button>
    </div>
  </section>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
